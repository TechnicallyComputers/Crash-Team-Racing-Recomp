[[func]]
pc = 0x800693C8
name = "NdIntroMeshSiblingDraw"
emit = false
status = "confirmed"
note = "Parent of GTE ras 0x80069C3C/60/84/A8. LIVE during digit-rain look-up (~f1274+): 176 RTPTs/frame, TR=0 via ctc2. Right-flap PolyFT3 via NdIntroSiblingRtptEmit (SX~390..595 FLAG=0). Linked at farthest OT bucket (gpu ot_rank 0) so additive 0x36 glow (~rank 1832) blends over them — looks like a short WoodEmit flap. WoodEmit 0x34 SX≤313 is the inner band only."

[[func]]
pc = 0x80069BB0
name = "NdIntroSiblingRtptEmit"
emit = false
status = "confirmed"
note = "Caller 0x80036F50. Loads RT from a1+40..56, ctc2 TR=0, a3=*(a1+244)+4092 (main OT last slot; a1+244 alternates 0x800F5D44/0x800F4D2C). Face loop AddPrim t9=a3+face_hi; look-up flaps face_hi≈0 → main-OT far (gpu ot_rank 0). Rain frame order: WoodBatchSetup (KART/LID*/GLOW/CODE/BOX_) → sibling → WoodEmit. CODE model stable 0x800FF390, GLOW 0x800FF294; each has own +228 OT (double-buffered ~0x800F1xxx/0x800F3xxx). Sharing CODE OT via OT_BATCH lands flaps in the digit bucket but DMA still walks flaps then 0x36 (digits on top) — same-bucket loses. PSX_ND_SIB_FLAP_LAST (opt-in): skip additive 0x36 with s11 SX max>=280 at OT 1600..2099 — shreds crate glow after AVSZ MAC0 fix; leave default off. Gate: tools/nd_intro_flap_check.py."

