[[site]]
pc = 0x8006AD88
name = "NdIntroWoodEmitHelper"
status = "confirmed"
note = "jalr $s5 from WoodEmit. OT: lw MAC0@44(at) (swc2 after AVSZ3), lw base@56(at)=model+228, index=MAC0>>17 (==OTZ>>5 only if MAC0 is unshifted ZSF3*sum — host AVSZ3 must not >>12 MAC0). Emits PolyFT3(0x30)/PolyGT3(0x34); falls into NdIntroDigitRainCode36 for 0x36. MENU Crash/trophy/banner: shifted-MAC0 bug collapsed all faces to slot 0. Batch OT ≠ sibling main OT."

[[site]]
pc = 0x8006AE34
name = "NdIntroDigitRainCode36"
status = "confirmed"
note = "Inside WoodEmitHelper fallthrough: lui 0x3600 → PolyGT3-raw-semi. Digit rain ~80–105× 0x36 at ot_rank~1832 (CODE model+228 + MAC0>>17); ABR=1. Same-bucket OT_BATCH still walks flaps then 0x36 (head-insert after sibling can't win — digits AddPrim later but DMA shows flaps first / digits on top). High OT_IDX buries the fountain. Stars=0x68. Prefer correct AVSZ MAC0 (unshifted) over PSX_ND_SIB_FLAP_LAST — the skip shreds this fountain."

[[site]]
pc = 0x8006AE90
name = "NdIntroWoodEmitHelperAlt"
status = "confirmed"
note = "Sibling helper in ptr table @0x8008A44C. Still count=0 during ND digit rain — not used."


[[site]]
pc = 0x8006AAF0
name = "NdIntroWoodBatchSetup"
status = "confirmed"
note = "Per-model wood batch: a0=stream, ra==a2=model. Gates +184 &0x40 set / &0x80 clear. Helpers +92/+96=AD88 during rain; +228=batch OT base (live at entry — model RAM reused later). Rain stream order: KART×6, LID2/D/C/B/A, GLOW@0x800FF294, CODE@0x800FF390, BOX_×6, then sibling. Read +228 here (or CODE+228 at sibling) for OT_BATCH; do not dump models after the frame."


[[site]]
pc = 0x8006ACE0
name = "NdIntroWoodHelperBound"
status = "confirmed"
note = "After delay-slot lw s5,96(ra). Probe: s5 always AD88 in ND; a2=model; faces @a2+200."


[[site]]
pc = 0x8006AD20
name = "NdIntroWoodBatchNext"
status = "confirmed"
note = "Stream next: lw ra,0(a0); bgez $0 → WoodBatchSetup. Shared skip target for flag rejects."


[[site]]
pc = 0x8008A444
name = "NdIntroWoodHelperTable"
status = "confirmed"
note = "ROM ptr table copied to scratch by 0x80071590 (at+196). [0]=AD88 [1]=B968 [2]=AE90 [3]=C778 [4]=BAD0 [5]=AD6C [6]=D670 [7]=D55C. Material desc+96 selects among these."

