note = "lh $v0,0x4DC(gp) then fall into NdIntroMeshDraw. Caller 0x80037830 jal (scene bit *+9580 & 0x1000). Same rate as NdIntroSceneBitDraw 47D64 during ND."

[[func]]
pc = 0x800444EC
name = "NdIntroMeshDraw"
emit = false
status = "guessed"
note = "ND crate intro draw (2572B). RTPT→scratch→clip→PolyG4(0x38) only (code 56 @0x80044E04). GTE ra 0x80044580: SX~206..645, obj Vx~-3006..-306, TR=0/H=256. OT via NdIntroOtFar (rank 0). Right-band 0x38s are gray/white gouraud — GP0 has ZERO textured prims with xmax>301 (wood FT3/GT3 stop at 301). Digits 0x3C ot~4829 overpaint this band."

[[func]]
pc = 0x800440A0
name = "NdIntroDrawDispatch"
emit = false
status = "confirmed"
note = "Mode/dispatch leaf jal'd from NdIntroMeshDraw (link 0x80044580). gp+0x4D4 mode + gp+0x4D8 depth countdown → NdIntroOtBase / Mode1 / NdIntroOtFar. v0 → $fp for all PolyG4 AddPrims. Probe nd_intro=2 @ ND digits: 100% NdIntroOtFar (44154/44268=0); $fp=0x800FBD40 ≈ ot_base+0x1005."

[[func]]
pc = 0x80044154
name = "NdIntroOtBase"
emit = false
status = "guessed"
note = "Returns *(game+buf*4+0x18C8) OT base. game=*(0x8008D2AC), buf=game+0xC. Unused during ND digit window (count=0)."

[[func]]
pc = 0x80044268
name = "NdIntroOtBaseMode1"
emit = false
status = "guessed"
note = "Same OT-base load as NdIntroOtBase; mode==1 / mode2 fallthroughs. Unused during ND digit window (count=0)."

[[func]]
pc = 0x800441A8
name = "NdIntroOtFar"
emit = false
status = "confirmed"
note = "jr $ra with v0=*(game+0x25C)+0xFFC → ot_index 0x1005. Depth≤0 path (mode==0). Reverse-OT high→low: PolyG4 rank 0. Digits use ot_base+4/+16 (index 1/4) → nearest (rank~4829). Wood OTZ~0xB00..0x1007 sits with OtFar — digits overpaint by guest OT design."

[[func]]
pc = 0x8006A52C
name = "NdIntroWoodEmit"
emit = false
status = "confirmed"
note = "Live textured wood (396B). RTPT ra 0x8006A564 + RTPS ra 0x8006A69C. Digit-rain look-up: WoodEmit 0x34 SX≤~313 (TR≈(0,948,1992)/H=320) — this is only the inner band. Right-flap extent past ~313 is NdIntroSiblingRtptEmit PolyFT3(0x30) SX~390..595, not missing WoodEmit verts. Later rain SX grows as TR.z falls. MENU ~f3100 SX≤301 false-positive."

